<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- VTP Server -->
  <rect x="20" y="98" width="134" height="64" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <text x="87" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="#633806">SW-1</text>
  <text x="87" y="142" text-anchor="middle" font-size="11" fill="#854F0B">VTP SERVER</text>
  <text x="87" y="94" text-anchor="middle" font-size="10" fill="#BA7517">Rev: 5 · Domain: CORP</text>
  <!-- VTP Client 1 -->
  <rect x="272" y="38" width="134" height="64" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.8"/>
  <text x="339" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="#042C53">SW-2</text>
  <text x="339" y="80" text-anchor="middle" font-size="11" fill="#185FA5">VTP CLIENT</text>
  <text x="339" y="34" text-anchor="middle" font-size="10" fill="#378ADD">Rev: 5 · Domain: CORP</text>
  <!-- VTP Client 2 -->
  <rect x="272" y="168" width="134" height="64" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.8"/>
  <text x="339" y="192" text-anchor="middle" font-size="13" font-weight="600" fill="#042C53">SW-3</text>
  <text x="339" y="210" text-anchor="middle" font-size="11" fill="#185FA5">VTP CLIENT</text>
  <text x="339" y="164" text-anchor="middle" font-size="10" fill="#378ADD">Rev: 5 · Domain: CORP</text>
  <!-- VTP Transparent -->
  <rect x="526" y="98" width="134" height="64" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="593" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="#444441">SW-4</text>
  <text x="593" y="142" text-anchor="middle" font-size="11" fill="#5F5E5A">VTP TRANSPARENT</text>
  <text x="593" y="94" text-anchor="middle" font-size="10" fill="#888780">Власні VLAN, пропускає VTP</text>
  <!-- Arrows Server → Clients -->
  <line x1="154" y1="118" x2="270" y2="70" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="154" y1="145" x2="270" y2="196" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Labels -->
  <rect x="154" y="78" width="112" height="16" rx="3" fill="#E1F5EE"/>
  <text x="210" y="90" text-anchor="middle" font-size="10" fill="#085041" font-weight="600">Summary + Subset Adv.</text>
  <rect x="154" y="162" width="112" height="16" rx="3" fill="#E1F5EE"/>
  <text x="210" y="174" text-anchor="middle" font-size="10" fill="#085041" font-weight="600">Summary + Subset Adv.</text>
  <!-- Transparent forward -->
  <line x1="406" y1="70" x2="524" y2="118" stroke="#888780" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <line x1="406" y1="200" x2="524" y2="148" stroke="#888780" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <rect x="406" y="152" width="114" height="16" rx="3" fill="#F1EFE8"/>
  <text x="463" y="164" text-anchor="middle" font-size="10" fill="#5F5E5A">VTP прозоро пропускає</text>
  <!-- Steps legend -->
  <text x="340" y="254" text-anchor="middle" font-size="11" fill="#5F5E5A">① Summary Advertisement (кожні 5 хв або Rev++) → ② Subset Advertisement (список VLAN)</text>
  <text x="340" y="272" text-anchor="middle" font-size="11" fill="#5F5E5A">③ Advertisement Request (якщо Revision клієнта нижчий за сервер)</text>
</svg>
