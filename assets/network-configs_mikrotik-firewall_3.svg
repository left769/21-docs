<svg width="100%" viewBox="0 0 800 290" xmlns="http://www.w3.org/2000/svg" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="pf-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ===== Row 1: transit path ===== -->
  <!-- Incoming interface -->
  <rect x="8" y="30" width="98" height="64" rx="8" fill="rgb(68,68,65)" stroke="rgb(180,178,169)" stroke-width="0.8"/>
  <text x="57" y="54" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="rgb(211,209,199)">Вхідний</text>
  <text x="57" y="72" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="rgb(211,209,199)">інтерфейс</text>

  <!-- PREROUTING -->
  <rect x="128" y="30" width="150" height="64" rx="8" fill="rgb(60,52,137)" stroke="rgb(175,169,236)" stroke-width="0.8"/>
  <text x="203" y="48" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="rgb(206,203,246)">PREROUTING</text>
  <text x="203" y="66" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="rgb(175,169,236)">RAW · conntrack</text>
  <text x="203" y="82" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="rgb(175,169,236)">NAT dstnat</text>

  <!-- Routing decision -->
  <rect x="300" y="30" width="110" height="64" rx="8" fill="rgb(68,68,65)" stroke="rgb(180,178,169)" stroke-width="0.8"/>
  <text x="355" y="54" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="rgb(211,209,199)">Рішення</text>
  <text x="355" y="72" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="rgb(211,209,199)">маршрутизації</text>

  <!-- FILTER forward -->
  <rect x="432" y="30" width="110" height="64" rx="8" fill="rgb(99,56,6)" stroke="rgb(239,159,39)" stroke-width="1.2"/>
  <text x="487" y="54" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="rgb(250,199,117)">FILTER</text>
  <text x="487" y="72" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="rgb(239,159,39)">forward</text>

  <!-- POSTROUTING -->
  <rect x="564" y="30" width="110" height="64" rx="8" fill="rgb(12,68,124)" stroke="rgb(133,183,235)" stroke-width="0.8"/>
  <text x="619" y="54" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="rgb(181,212,244)">POSTROUTING</text>
  <text x="619" y="72" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="rgb(133,183,235)">NAT srcnat</text>

  <!-- Outgoing interface -->
  <rect x="696" y="30" width="98" height="64" rx="8" fill="rgb(68,68,65)" stroke="rgb(180,178,169)" stroke-width="0.8"/>
  <text x="745" y="54" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="rgb(211,209,199)">Вихідний</text>
  <text x="745" y="72" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="rgb(211,209,199)">інтерфейс</text>

  <!-- Row 1 arrows -->
  <line x1="106" y1="62" x2="126" y2="62" stroke="rgb(138,136,128)" stroke-width="1.6" marker-end="url(#pf-arrow)"/>
  <line x1="278" y1="62" x2="298" y2="62" stroke="rgb(138,136,128)" stroke-width="1.6" marker-end="url(#pf-arrow)"/>
  <line x1="410" y1="62" x2="430" y2="62" stroke="rgb(138,136,128)" stroke-width="1.6" marker-end="url(#pf-arrow)"/>
  <line x1="542" y1="62" x2="562" y2="62" stroke="rgb(138,136,128)" stroke-width="1.6" marker-end="url(#pf-arrow)"/>
  <line x1="674" y1="62" x2="694" y2="62" stroke="rgb(138,136,128)" stroke-width="1.6" marker-end="url(#pf-arrow)"/>
  <text x="487" y="20" text-anchor="middle" font-size="12" fill="rgb(138,136,128)">транзит ЧЕРЕЗ R1</text>

  <!-- ===== Row 2: traffic to / from the router itself ===== -->
  <!-- FILTER input -->
  <rect x="300" y="170" width="110" height="64" rx="8" fill="rgb(99,56,6)" stroke="rgb(239,159,39)" stroke-width="1.2"/>
  <text x="355" y="194" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="rgb(250,199,117)">FILTER</text>
  <text x="355" y="212" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="rgb(239,159,39)">input</text>

  <!-- Local processes -->
  <rect x="432" y="170" width="110" height="64" rx="8" fill="rgb(8,80,65)" stroke="rgb(93,202,165)" stroke-width="0.8"/>
  <text x="487" y="194" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="rgb(159,225,203)">Процеси R1</text>
  <text x="487" y="212" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="rgb(93,202,165)">WinBox, SSH, DNS</text>

  <!-- FILTER output -->
  <rect x="564" y="170" width="110" height="64" rx="8" fill="rgb(99,56,6)" stroke="rgb(239,159,39)" stroke-width="1.2"/>
  <text x="619" y="194" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="rgb(250,199,117)">FILTER</text>
  <text x="619" y="212" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="rgb(239,159,39)">output</text>

  <!-- Row 2 arrows -->
  <line x1="355" y1="94" x2="355" y2="168" stroke="rgb(138,136,128)" stroke-width="1.6" marker-end="url(#pf-arrow)"/>
  <text x="363" y="136" font-size="12" fill="rgb(138,136,128)">ДО R1</text>
  <line x1="410" y1="202" x2="430" y2="202" stroke="rgb(138,136,128)" stroke-width="1.6" marker-end="url(#pf-arrow)"/>
  <line x1="542" y1="202" x2="562" y2="202" stroke="rgb(138,136,128)" stroke-width="1.6" marker-end="url(#pf-arrow)"/>
  <line x1="619" y1="170" x2="619" y2="96" stroke="rgb(138,136,128)" stroke-width="1.6" marker-end="url(#pf-arrow)"/>
  <text x="627" y="136" font-size="12" fill="rgb(138,136,128)">ВІД R1</text>

  <!-- ===== Legend ===== -->
  <rect x="8" y="262" width="14" height="14" rx="3" fill="rgb(99,56,6)" stroke="rgb(239,159,39)" stroke-width="1"/>
  <text x="28" y="273" font-size="12" fill="rgb(138,136,128)">Filter — правила цієї інструкції</text>
  <rect x="238" y="262" width="14" height="14" rx="3" fill="rgb(60,52,137)" stroke="rgb(175,169,236)" stroke-width="1"/>
  <text x="258" y="273" font-size="12" fill="rgb(138,136,128)">RAW / Connection tracking / dstnat</text>
  <rect x="490" y="262" width="14" height="14" rx="3" fill="rgb(12,68,124)" stroke="rgb(133,183,235)" stroke-width="1"/>
  <text x="510" y="273" font-size="12" fill="rgb(138,136,128)">srcnat</text>
  <text x="794" y="273" text-anchor="end" font-size="11" fill="rgb(138,136,128)">спрощено: Mangle не показано</text>
</svg>
