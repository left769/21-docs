<svg width="100%" viewBox="0 0 680 370" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Legitimate PC -->
  <rect x="20" y="58" width="120" height="54" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.8"/>
  <text x="80" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#085041">Легітимний PC</text>
  <text x="80" y="98" text-anchor="middle" font-size="11" fill="#0F6E56">192.168.1.10</text>

  <!-- Attacker -->
  <rect x="20" y="148" width="120" height="54" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="80" y="170" text-anchor="middle" font-size="12" font-weight="600" fill="#4A1B0C">Зловмисник</text>
  <text x="80" y="188" text-anchor="middle" font-size="11" fill="#993C1D">MAC flood / ARP / IP</text>

  <!-- Rogue device -->
  <rect x="20" y="238" width="120" height="54" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="80" y="258" text-anchor="middle" font-size="12" font-weight="600" fill="#4A1B0C">Rogue Device</text>
  <text x="80" y="276" text-anchor="middle" font-size="11" fill="#993C1D">Fake DHCP / BPDU</text>

  <!-- Cisco Switch -->
  <rect x="264" y="128" width="152" height="110" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <text x="340" y="152" text-anchor="middle" font-size="12" font-weight="600" fill="#633806">Cisco Switch</text>
  <text x="340" y="170" text-anchor="middle" font-size="10" fill="#854F0B">Port Security</text>
  <text x="340" y="185" text-anchor="middle" font-size="10" fill="#854F0B">DHCP Snooping</text>
  <text x="340" y="200" text-anchor="middle" font-size="10" fill="#854F0B">DAI · IP Source Guard</text>
  <text x="340" y="215" text-anchor="middle" font-size="10" fill="#854F0B">BPDU Guard · Root Guard</text>
  <text x="340" y="228" text-anchor="middle" font-size="10" fill="#888780">DTP disabled · native VLAN≠1</text>

  <!-- DHCP Server (legitimate) -->
  <rect x="550" y="58" width="110" height="54" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.8"/>
  <text x="605" y="78" text-anchor="middle" font-size="12" font-weight="600" fill="#042C53">DHCP Server</text>
  <text x="605" y="96" text-anchor="middle" font-size="11" fill="#185FA5">легітимний</text>

  <!-- Rogue DHCP -->
  <rect x="550" y="248" width="110" height="54" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="605" y="268" text-anchor="middle" font-size="12" font-weight="600" fill="#4A1B0C">Rogue DHCP</text>
  <text x="605" y="286" text-anchor="middle" font-size="11" fill="#993C1D">зловмисний</text>

  <!-- Arrows: PC → Switch (green, trusted) -->
  <line x1="140" y1="85" x2="262" y2="163" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Arrows: Attacker → Switch (red) -->
  <line x1="140" y1="175" x2="262" y2="183" stroke="#D85A30" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="144" y="162" width="114" height="16" rx="3" fill="#FAECE7"/>
  <text x="201" y="174" text-anchor="middle" font-size="10" fill="#993C1D" font-weight="600">MAC flood / ARP poison</text>

  <!-- Rogue Device → Switch -->
  <line x1="140" y1="265" x2="262" y2="220" stroke="#D85A30" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <rect x="144" y="244" width="114" height="16" rx="3" fill="#FAECE7"/>
  <text x="201" y="256" text-anchor="middle" font-size="10" fill="#993C1D" font-weight="600">Rogue DHCP / BPDU</text>

  <!-- Switch → Legit DHCP (trusted) -->
  <line x1="416" y1="163" x2="548" y2="90" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="422" y="112" width="118" height="16" rx="3" fill="#E1F5EE"/>
  <text x="481" y="124" text-anchor="middle" font-size="10" fill="#085041" font-weight="600">trusted port · DHCP ACK ✓</text>

  <!-- Switch → Rogue DHCP (blocked) -->
  <line x1="416" y1="218" x2="548" y2="268" stroke="#D85A30" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <rect x="422" y="248" width="118" height="16" rx="3" fill="#FAECE7"/>
  <text x="481" y="260" text-anchor="middle" font-size="10" fill="#993C1D" font-weight="600">untrusted → BLOCKED ✗</text>

  <!-- Bottom legend -->
  <rect x="20" y="318" width="640" height="44" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="340" y="334" text-anchor="middle" font-size="10" fill="#5F5E5A">Port Security: обмеження MAC · DHCP Snooping: trusted/untrusted · DAI: ARP по binding table</text>
  <text x="340" y="350" text-anchor="middle" font-size="10" fill="#5F5E5A">IP Source Guard: тільки дозволені src IP · BPDU Guard: блок несанкціонованих BPDU · nonegotiate: вимкнути DTP</text>
</svg>
