<svg width="100%" viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="fw-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Internet -->
  <rect x="290" y="14" width="140" height="50" rx="8" fill="rgb(68,68,65)" stroke="rgb(180,178,169)" stroke-width="0.8"/>
  <text x="360" y="34" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="rgb(211,209,199)">Інтернет (ISP)</text>
  <text x="360" y="52" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(180,178,169)">WAN · DHCP</text>

  <!-- WAN link -->
  <line x1="360" y1="64" x2="360" y2="106" stroke="rgb(138,136,128)" stroke-width="2"/>
  <text x="370" y="89" font-size="12" fill="rgb(138,136,128)">ether1 · список WAN</text>

  <!-- MikroTik R1 -->
  <rect x="270" y="106" width="180" height="64" rx="8" fill="rgb(99,56,6)" stroke="rgb(239,159,39)" stroke-width="0.8"/>
  <text x="360" y="129" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="rgb(250,199,117)">MikroTik R1</text>
  <text x="360" y="150" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(239,159,39)">Firewall · NAT · RouterOS 7</text>

  <!-- VLAN gateways (left of R1) -->
  <text x="24" y="122" font-size="12" fill="#1D9E75">vlan.10 · 192.168.10.1/24</text>
  <text x="24" y="140" font-size="12" fill="#7F77DD">vlan.20 · 192.168.20.1/24</text>
  <text x="24" y="158" font-size="12" fill="#D85A30">vlan.30 · 192.168.30.1/24</text>
  <text x="24" y="104" font-size="11" fill="rgb(138,136,128)">список LAN (шлюзи VLAN):</text>
  <line x1="196" y1="138" x2="268" y2="138" stroke="rgb(138,136,128)" stroke-width="0.8" stroke-dasharray="4 3"/>

  <!-- NAT notes (right of R1) -->
  <text x="466" y="128" font-size="12" fill="rgb(138,136,128)">srcnat: LAN -&gt; WAN (masquerade)</text>
  <text x="466" y="146" font-size="12" fill="#D85A30">dstnat: WAN:8080 -&gt; 192.168.30.10:80</text>

  <!-- Trunk link -->
  <line x1="360" y1="170" x2="360" y2="236" stroke="rgb(138,136,128)" stroke-width="2.5"/>
  <text x="370" y="207" font-size="12" fill="rgb(138,136,128)">ether5 · 802.1Q trunk (VLAN 10, 20, 30)</text>

  <!-- Switch -->
  <rect x="280" y="236" width="160" height="50" rx="8" fill="rgb(12,68,124)" stroke="rgb(133,183,235)" stroke-width="0.8"/>
  <text x="360" y="255" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="rgb(181,212,244)">Комутатор</text>
  <text x="360" y="273" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(133,183,235)">trunk / access-порти</text>

  <!-- Switch to hosts -->
  <line x1="310" y1="286" x2="125" y2="340" stroke="#1D9E75" stroke-width="1.4" marker-end="url(#fw-arrow)"/>
  <line x1="360" y1="286" x2="360" y2="340" stroke="#7F77DD" stroke-width="1.4" marker-end="url(#fw-arrow)"/>
  <line x1="410" y1="286" x2="595" y2="340" stroke="#D85A30" stroke-width="1.4" marker-end="url(#fw-arrow)"/>
  <text x="118" y="304" font-size="11.5" fill="#1D9E75">access VLAN 10</text>
  <text x="368" y="318" font-size="11.5" fill="#7F77DD">access VLAN 20</text>
  <text x="506" y="304" font-size="11.5" fill="#D85A30">access VLAN 30</text>

  <!-- Host: admin -->
  <rect x="24" y="342" width="200" height="58" rx="8" fill="rgb(8,80,65)" stroke="rgb(93,202,165)" stroke-width="0.8"/>
  <text x="124" y="362" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="600" fill="rgb(159,225,203)">Адміністратор (MGMT)</text>
  <text x="124" y="382" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(93,202,165)">VLAN 10 · 192.168.10.100</text>

  <!-- Host: user -->
  <rect x="260" y="342" width="200" height="58" rx="8" fill="rgb(60,52,137)" stroke="rgb(175,169,236)" stroke-width="0.8"/>
  <text x="360" y="362" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="600" fill="rgb(206,203,246)">Користувач</text>
  <text x="360" y="382" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(175,169,236)">VLAN 20 · 192.168.20.100</text>

  <!-- Host: web server -->
  <rect x="496" y="342" width="200" height="58" rx="8" fill="rgb(113,43,19)" stroke="rgb(240,153,123)" stroke-width="0.8"/>
  <text x="596" y="362" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="600" fill="rgb(245,196,179)">Web-сервер</text>
  <text x="596" y="382" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(240,153,123)">VLAN 30 · 192.168.30.10</text>
</svg>
